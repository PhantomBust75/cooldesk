services:
  postgres:
    image: postgres:14
    container_name: cooldesk-postgres
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cooldesk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:-cooldesk-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cooldesk-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_USER_SECRET: ${JWT_USER_SECRET}
      JWT_DEALER_SECRET: ${JWT_DEALER_SECRET}
      JWT_PLATFORM_SECRET: ${JWT_PLATFORM_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    networks:
      - cooldesk_net

  nginx:
    image: nginx:1.27-alpine
    container_name: cooldesk-nginx
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - cooldesk_net

  certbot:
    image: certbot/certbot:latest
    container_name: cooldesk-certbot
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Run manually for first-time issuance:
    # NOTE: --entrypoint certbot is required — this service's own entrypoint below
    # is a renewal-loop shell script that ignores any command passed to `run` and
    # never exits, so without this override the container leaks forever (--rm
    # only removes it once it exits) instead of running certonly and finishing.
    #   docker compose run --rm --entrypoint certbot certbot certonly --webroot \
    #     -w /var/www/certbot \
    #     -d api.yourdomain.com \
    #     --email you@yourdomain.com --agree-tos --no-eff-email
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - cooldesk_net

volumes:
  postgres_data:
  letsencrypt_data:
  certbot_webroot:

networks:
  cooldesk_net:
    driver: bridge
