name: Deploy Production

on:
  push:
    branches: [prod]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_REPO: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          echo "backend_image=${IMAGE_REPO}/backend:${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "frontend_image=${IMAGE_REPO}/frontend:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.backend_image }}
            ${{ env.IMAGE_REPO }}/backend:prod-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_AUTH_LOGIN_PATH=${{ vars.NEXT_PUBLIC_AUTH_LOGIN_PATH }}
          tags: |
            ${{ steps.tags.outputs.frontend_image }}
            ${{ env.IMAGE_REPO }}/frontend:prod-latest

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ steps.tags.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.tags.outputs.frontend_image }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          HEALTHCHECK_API_URL: ${{ vars.HEALTHCHECK_API_URL }}
          HEALTHCHECK_APP_URL: ${{ vars.HEALTHCHECK_APP_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,PROD_ENV_FILE,HEALTHCHECK_API_URL,HEALTHCHECK_APP_URL
          script: |
            set -euo pipefail
            cd /opt/cooldesk

            chmod +x scripts/deploy.sh scripts/init-ssl.sh
            STACK_DIR=/opt/cooldesk BACKEND_IMAGE="${BACKEND_IMAGE}" FRONTEND_IMAGE="${FRONTEND_IMAGE}" HEALTHCHECK_API_URL="${HEALTHCHECK_API_URL}" HEALTHCHECK_APP_URL="${HEALTHCHECK_APP_URL}" PROD_ENV_FILE="${PROD_ENV_FILE}" scripts/deploy.sh

            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate